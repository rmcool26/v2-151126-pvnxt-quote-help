['Cables, earthing & LA',[['DC cable','dcc','s',()=>C.dc.map(m=>[m.id,m.n])],['DC length (m)','dc','n'],['AC cable','acc','s',()=>C.ac.map(m=>[m.id,m.n])],['AC length (m)','ac','n'],['Earth pits','pits','n'],['Lightning arresters','la','n']]],
['Pricing & subsidy',[['List price override (₹)','over','n'],['Discount (₹)','disc','n'],['Add-on charges (₹)','addon','n'],['Central subsidy (PM Surya Ghar)','csub','c'],['State subsidy (₹)','ssub','n']]]];
function fld(q,[l,k,t,o,sh]){if(sh&&!sh(q))return'';const v=q[k];if(t=='c')return`<label class="sw"><input type="checkbox" data-k="${k}" ${v?'checked':''}>${l}</label>`;
if(t=='s')return`<label>${l}<select data-k="${k}" data-r="1">${k=='discom'?'<option value="">Select</option>':''}${o(q).map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${tx(a)}" ${a==v?'selected':''}>${tx(b)}</option>`}).join('')}</select></label>`;
return`<label>${l}<input data-k="${k}" type="${t=='n'?'number':'text'}" ${t=='n'?'step="any" min="0" inputmode="decimal"':''} value="${tx(v)}"></label>`}
function sumHTML(q){const c=calc(q),e=bad(q);return`<dl>${c.parts.map(p=>`<div><span>${p[0]}</span><span>${R(p[1])}</span></div>`).join('')}<div><span>List price${q.over!==''?' (override)':''}</span><b>${R(c.list)}</b></div><div><span>GST ${C.gst}%</span><span>${R(c.gst)}</span></div><div><span>Total</span><b>${R(c.total)}</b></div><div class="neg"><span>Central subsidy</span><span>− ${R(c.cs)}</span></div><div class="neg"><span>State subsidy</span><span>− ${R(q.ssub)}</span></div><div class="big"><span>Net cost</span><span>${R(c.cost)}</span></div></dl><p style="font-size:13px;color:var(--ink2)">${c.k.toFixed(2)} kWp · saves ${R(c.mon)}/month · payback ${c.pb.toFixed(1)} yrs</p>${e?`<div class="msg">${e}</div>`:''}<button class="btn" style="width:100%" ${e?'disabled':''} onclick="pre()">Preview proposal</button>`}
function auto(q,k){if(k=='kwp'||k=='mod'){const w=by(C.modules,q.mod).wp;if(k=='kwp')q.modules=Math.max(1,Math.ceil(q.kwp*1000/w));else q.modules=Math.ceil(q.kwp*1000/w);const kk=q.modules*w/1000;q.inv=(C.inverters.find(i=>i.kw>=kk*.9)||C.inverters.at(-1)).id;q.dc=Math.max(20,Math.round(kk*7))}
if(k=='modules'){q.kwp=+(q.modules*by(C.modules,q.mod).wp/1000).toFixed(2)}
if(k=='state'){q.discom='';q.tariff=C.states[q.state].tariff;q.ssub=C.states[q.state].sub}}
function open_(q){Q=q||newQ({tariff:6.5});V="form";drawForm()}
function drawForm(){const y=scrollY;$.innerHTML=`<button class="btn o" onclick="list()">← Quotes</button><h2>${Q.id}: new quote</h2><p style="color:var(--ink2);margin-top:-8px">Prices come from your catalog. Auto-filled values are editable.</p><div class="lay"><div id="fm">${FS.map(([t,fs])=>`<fieldset><legend>${t}</legend><div class="g">${fs.map(x=>fld(Q,x)).join('')}</div></fieldset>`).join('')}
<fieldset><legend>Payment milestones (%)</legend><div class="g">${['On booking','Before supply','Post installation','After net-metering'].map((l,i)=>`<label>${l}<input type="number" data-m="${i}" min="0" value="${Q.ms[i]}"></label>`).join('')}<label class="sw"><input type="checkbox" data-k="pay" ${Q.pay?'checked':''}>Include online payment link</label></div></fieldset></div><aside class="sum" id="sm">${sumHTML(Q)}</aside></div>`;
const fm=document.getElementById('fm'),up=()=>document.getElementById('sm').innerHTML=sumHTML(Q);
fm.oninput=e=>{const t=e.target,k=t.dataset.k;if(t.dataset.m){Q.ms[t.dataset.m]=+t.value;up();return}if(!k||t.dataset.r||t.type=='checkbox')return;Q[k]=t.type=='number'&&t.value!==''?+t.value:t.value;if(['kwp','modules'].includes(k)){auto(Q,k);['modules','kwp','inv','dc'].forEach(x=>{if(x!=k){const el=fm.querySelector(`[data-k=${x}]`);if(el)el.value=Q[x]}})}up()};
fm.onchange=e=>{const t=e.target,k=t.dataset.k;if(!k||(t.type!='checkbox'&&!t.dataset.r))return;Q[k]=t.type=='checkbox'?t.checked:t.value;auto(Q,k);drawForm();scrollTo(0,y)};scrollTo(0,0)}
function show(id){Q=DB.find(q=>q.id==id);pre()}
function pre(){V='pre';const q=Q,c=calc(q),e=bad(q),ep=C.epc,dt=new Date(q.date),fd=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),vt=new Date(dt.getTime()+15*864e5),ms=['On booking','Before supply','Post installation','After net-metering'],
w=[['Solar modules','25 yr product'],['Inverter','10 yr product'],['Mounting structure','10 yr product'],['Balance of system','5 yr product']],
inc=['Solar panels, inverter, structure and BOS','Standard AC/DC wiring, ACDB/DCDB and protection','Earthing and lightning arrester as per design','Installation and commissioning','Subsidy and net-metering documentation support','Basic customer training after installation',...(q.battery?['Battery bank '+q.batKwh+' kWh']:[]),...(q.clean?['Panel cleaning system']:[])],
exc=['Extra structure height / customised structure','RCC civil, waterproofing or roof repair','Meter shifting / electrical panel modification','Extra cable beyond standard lengths','Crane, lift or special material shifting','DISCOM / government charges',...(q.battery?[]:['Battery backup unless specifically quoted']),'Inverter sheds'],
hdr=`<div class="hd"><b>${tx(ep.name)}</b><span>${c.k.toFixed(2)} kWp · ${q.consumer}</span><span>Quotation ${q.id}</span></div>`,ft=n=>`<div class="ft"><span>${fd(dt)} · valid 15 days</span><span>${n} of 3</span><span>pvNXT Studio</span></div>`;
$.innerHTML=`<div class="bar noprint"><button class="btn o" onclick="drawForm()">← Edit</button><button class="btn" onclick="window.print()">Download PDF</button><button class="btn o" id="wa">WhatsApp</button><button class="btn o" id="em">Email</button><button class="btn o" id="cp">Copy link</button></div><div class="pw">
<section class="pg cv"><div style="display:flex;justify-content:space-between"><b class="h" style="font-size:20px">${tx(ep.name)}</b><b class="h">Generated by pvNXT Studio</b></div><span class="bdg">V1.0 · 01 OF 03</span><h1>QUOTATION</h1><div class="sub">${q.type} · ${tx(q.name)}</div><div class="rule"></div><b class="h" style="font-size:15px">${q.id} &nbsp;·&nbsp; ${c.k.toFixed(2)} kWp &nbsp;·&nbsp; ${fd(dt)} &nbsp;·&nbsp; ${q.consumer}</b>
<div class="by"><div><small>PREPARED FOR</small><br><b class="h" style="font-size:17px">${tx(q.name)}</b><br>${tx(q.email)} ${tx(q.phone)}</div><div><small>PREPARED BY</small><br><b class="h" style="font-size:17px">${tx(ep.name)}</b><br>${ep.email} · ${ep.phone}</div></div></section>
<section class="pg">${hdr}<h2>Rooftop Solar Quotation</h2><p style="color:#3c5459">${c.k.toFixed(2)} kWp ${q.type.toLowerCase()} plant at ${tx(q.addr||q.state)}</p><div class="k4"><div>PLANT SIZE<b>${c.k.toFixed(2)} kWp</b>${q.modules} modules</div><div>PAYBACK<b>${Math.floor(c.pb)} yr ${Math.round(c.pb%1*12)} mo</b>then free for 20+ yrs</div><div>DISCOM<b>${tx(q.discom||'Not set')}</b>${q.consumer}</div><div>MONTHLY SAVING<b>${R(c.mon)}</b>at ₹${q.tariff}/unit</div></div>
<div class="two"><div><h4>Quotation details</h4><div class="r"><span>File</span><b>${q.id}</b></div><div class="r"><span>Issued / valid till</span><b>${fd(dt)} / ${fd(vt)}</b></div><div class="r"><span>EPC</span><b>${tx(ep.name)}</b></div></div><div><h4>Site</h4><div class="r"><span>State</span><b>${q.state}</b></div><div class="r"><span>Sanctioned load</span><b>${q.load?q.load+' kW':'Not set'}</b></div><div class="r"><span>Type</span><b>${q.type}</b></div></div></div>
<table><tr><th>ITEM</th><th>VALUE</th></tr><tr><td>Module</td><td>${q.modules} × ${c.m.n}</td></tr><tr><td>Inverter</td><td>${c.i.n} (${c.i.kw} kW AC)</td></tr><tr><td>Structure</td><td>${by(C.structures,q.struct).n}</td></tr><tr><td>DC cable</td><td>${by(C.dc,q.dcc).n} · ${q.dc} m</td></tr><tr><td>AC cable</td><td>${by(C.ac,q.acc).n} · ${q.ac} m</td></tr><tr><td>Earthing & LA</td><td>${q.pits} earth pits · ${q.la} lightning arrester</td></tr>${q.battery?`<tr><td>Battery</td><td>${q.batKwh} kWh</td></tr>`:''}</table>
<div class="r"><span>Net before tax</span><b>${R(c.net)}</b></div><div class="r"><span>GST ${C.gst}%</span><b>${R(c.gst)}</b></div><div class="r"><span>Central subsidy</span><b>− ${R(c.cs)}</b></div><div class="r"><span>State subsidy</span><b>− ${R(q.ssub)}</b></div>
<div class="gt"><div>GRAND TOTAL<br><small>Inclusive of all applicable taxes</small></div><b>${R(c.total)}</b></div><div class="gt" style="margin-top:0"><div>NET COST AFTER SUBSIDY</div><b style="color:#047f8e">${R(c.cost)}</b></div><div class="w">${w.map(x=>`<div>${x[0]}<b>${x[1]}</b></div>`).join('')}</div>${ft(2)}</section>
<section class="pg">${hdr}<h2>Warranty and terms</h2><div class="ms">${q.ms.map((p,i)=>`<div><i>${p}%</i><b class="h" style="font-size:11px;color:#047f8e">MILESTONE ${i+1}</b><br>${ms[i]}<br><b class="h" style="font-size:16px">${R(c.total*p/100)}</b></div>`).join('')}</div>
${q.pay?`<div class="box" style="margin-bottom:14px"><b class="h">Pay securely online</b><br>Booking amount ${R(c.total*q.ms[0]/100)}: <a href="${api.payUrl(q)}">${api.payUrl(q)}</a></div>`:''}
<div class="two"><div class="box"><h4>Documents required</h4><ul>${['Latest electricity bill','Aadhaar card','PAN card','Cancelled cheque / passbook','Property proof (loan cases)','Mobile and email updated on the bill'].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="box"><h4>Bank account details</h4>${Object.entries({'Account holder':ep.bank.holder,'Account number':ep.bank.no,'IFSC':ep.bank.ifsc,'Branch':ep.bank.branch,'Type':ep.bank.type}).map(([a,b])=>`<div class="r"><span>${a}</span><b>${b}</b></div>`).join('')}</div></div>
<div class="two" style="margin-top:16px"><div><h4 style="color:#1a7f37">Included</h4><ul>${inc.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4 style="color:#b3261e">Not included</h4><ul>${exc.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
<p class="box" style="margin-top:16px;font-size:12px">Indicative timeline. Steps after commissioning depend on DISCOM and government processing, which ${tx(ep.name)} assists with but does not control. Where the purchase is financed, payment follows the bank’s schedule. Savings are estimates from expected generation and your tariff.</p>${ft(3)}</section></div>`;
const url=api.shareUrl(q),sent=()=>{if(q.status=='Draft')q.status='Sent';api.save(q)};
document.getElementById('wa').onclick=()=>{if(e)return toast(e);sent();const t=`Hi ${q.name}, your solar quotation ${q.id} (${R(c.total)}, net ${R(c.cost)} after subsidy): ${url}`;navigator.share?navigator.share({text:t}).catch(()=>{}):open('https://wa.me/?text='+encodeURIComponent(t))};
document.getElementById('em').onclick=async()=>{if(e)return toast(e);sent();await api.email(q);toast('Email action called')};
document.getElementById('cp').onclick=()=>{if(e)return toast(e);sent();navigator.clipboard?.writeText(url);toast('Link copied')};scrollTo(0,0)}
document.getElementById('nq').onclick=()=>open_();
api.catalog().then(c=>{C=c;list()}).catch(()=>{$.innerHTML='<div class="ban"><span>Could not load data/catalog.json. Serve this folder over http, see README.</span></div>'});
</script></body></html>
